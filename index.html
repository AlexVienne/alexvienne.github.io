<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo Editor — MVP</title>
<style>
:root{--bg:#f1f1f3;--panel:#fff;--line:#dcdce0;--text:#1b1b1f;--mute:#76767f;--acc:#4f5df0;--stage:#e4e4e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--panel:#1f1f23;--line:#323238;--text:#ececf0;--mute:#8d8d97;--acc:#8a95ff;--stage:#101012}}
:root[data-theme="dark"]{--bg:#17171a;--panel:#1f1f23;--line:#323238;--text:#ececf0;--mute:#8d8d97;--acc:#8a95ff;--stage:#101012}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;height:100%}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#bar .sp{flex:1}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
#stage{flex:1;min-height:0;background:var(--stage);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}
#wrap{width:100%;height:100%;padding:16px;display:flex;align-items:center;justify-content:center;transform-origin:center}
canvas#c{max-width:100%;max-height:100%;display:block;box-shadow:0 2px 24px rgba(0,0,0,.25)}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;color:var(--mute);padding:20px}
#empty b{color:var(--text);font-size:17px;font-weight:600}
#stage.drag{outline:2px dashed var(--acc);outline-offset:-10px}
#side{width:300px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:12px}
#hist{width:100%;height:80px;display:block;background:var(--bg);border-radius:6px;margin-bottom:10px}
h3{font-size:12px;font-weight:600;margin:14px 0 6px;color:var(--mute)}
.r{display:grid;grid-template-columns:92px 1fr 38px;align-items:center;gap:6px;margin:3px 0}
.r label{color:var(--text)}
.r output{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
#pre{display:flex;flex-wrap:wrap;gap:6px}
#pre button{padding:4px 9px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tabs button{padding:3px 10px}.tabs button.on{border-color:var(--acc);color:var(--acc)}#cc{width:100%;aspect-ratio:1;background:var(--bg);border-radius:6px;touch-action:none;display:block;cursor:crosshair}
:root:root:root{--bg:#1c1c1c;--panel:#2b2b2b;--line:#3c3c3c;--text:#d2d2d2;--mute:#8c8c8c;--acc:#6aa6dc;--stage:#161616;--tr:#4d4d4d}
#side{width:320px;padding:0 14px 16px}
#hist{height:90px;margin:12px 0 6px;background:#1c1c1c;border:1px solid var(--line);border-radius:2px}
h3{display:flex;justify-content:space-between;align-items:center;margin:0;padding:10px 0;border-top:1px solid var(--line);font-size:13px;font-weight:500;color:var(--text);cursor:pointer;user-select:none}
h3::after{content:"▾";font-size:12px;color:var(--mute)}
h3.shut::after{content:"▸"}
h3:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.body{padding-bottom:10px}
.r{grid-template-columns:86px 1fr 34px;gap:8px;margin:2px 0}
.r label{color:var(--mute);font-size:12px}
.r output{color:var(--text);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;margin:0;background-color:transparent;background-repeat:no-repeat;background-position:center;background-size:100% 2px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{background:transparent;height:16px}
input[type=range]::-moz-range-track{background:transparent;height:16px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:2.5px;border-radius:50%;background:#cfcfcf;border:0;box-shadow:0 0 0 1px #111}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#cfcfcf;border:0;box-shadow:0 0 0 1px #111}
input[type=range]:hover::-webkit-slider-thumb{background:#fff}
button{border-radius:3px;background:#383838;border-color:#383838}
button:hover{border-color:var(--mute)}
button.p{background:var(--acc);border-color:var(--acc);color:#10202e}
.tabs button.on{background:#4a4a4a;border-color:#4a4a4a;color:var(--text)}
#cc{border:1px solid var(--line);border-radius:2px;background:#1c1c1c}
@media (max-width:760px){#app{flex-direction:column}#side{width:100%;height:42%;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
 <div id="main">
  <div id="bar">
   <button id="open" class="p">Открыть фото</button>
   <button id="undo" disabled title="Ctrl+Z">Отменить</button><button id="redo" disabled title="Ctrl+Shift+Z">Повторить</button><button id="cmp" disabled>Удерживайте: до</button>
   <button id="fit" disabled>Сбросить вид</button>
   <span class="sp"></span>
   <select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
   <button id="exp" class="p" disabled>Экспорт</button>
  </div>
  <div id="stage">
   <div id="wrap"><canvas id="c" width="1" height="1"></canvas></div>
   <div id="empty"><b>Перетащите фото сюда</b><span>или вставьте из буфера (Ctrl+V), или нажмите «Открыть фото»</span></div>
  </div>
 </div>
 <aside id="side">
  <canvas id="hist" width="256" height="80"></canvas>
  <h3>Пресеты</h3><div id="pre"></div>
  <h3>Геометрия</h3><div id="geo"></div><div id="sl" class="stop"></div><h3>Кривые</h3><div id="tabs" class="tabs"></div><canvas id="cc" width="240" height="240"></canvas><h3>Цвет по тонам (HSL)</h3><div id="bands" class="tabs"></div><div id="hs"></div>
  <p class="stop" style="margin-top:16px"><button id="reset" disabled>Сбросить все правки</button></p>
 </aside>
</div>
<input type="file" id="file" accept="image/*" hidden>
<div id="toast" style="display:none;position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:9;max-width:90%"></div>
<script>
const GROUPS=[
 ['Свет',[['exposure','Экспозиция',-2,2],['contrast','Контраст',-1,1],['highlights','Света',-1,1],['shadows','Тени',-1,1],['whites','Белые',-1,1],['blacks','Чёрные',-1,1]]],
 ['Цвет',[['temp','Температура',-1,1],['tint','Оттенок',-1,1],['sat','Насыщенность',-1,1],['vib','Вибрация',-1,1]]],
 ['Детали и эффекты',[['sharp','Резкость',0,1],['vig','Виньетка',-1,1],['grain','Зерно',0,1]]]
];
const KEYS=GROUPS.flatMap(g=>g[1].map(s=>s[0]));
const PRESETS={
 'Оригинал':{},
 'Яркий':{contrast:.2,sat:.25,vib:.3,shadows:.2},
 'Тёплый':{temp:.35,tint:.05,contrast:.1,sat:.1},
 'Холодный':{temp:-.35,contrast:.1,shadows:.15},
 'Ч/Б':{sat:-1,contrast:.25,grain:.25},
 'Плёнка':{contrast:-.1,blacks:.3,sat:-.15,temp:.15,grain:.45,vig:.3},
 'Драма':{contrast:.4,highlights:-.5,shadows:.4,sharp:.5,vig:.4}
};
const V={};KEYS.forEach(k=>V[k]=0);
const $=id=>document.getElementById(id);
const cv=$('c'),gl=cv.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false});
let tex=null,loaded=false,before=false,hasImg=false;

const VS='attribute vec2 p;varying vec2 v;void main(){v=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
const FS=`precision highp float;varying vec2 v;uniform sampler2D t;uniform vec2 px;uniform float on;
uniform float exposure,contrast,highlights,shadows,whites,blacks,temp,tint,sat,vib,sharp,vig,grain;
uniform sampler2D lut;uniform vec2 outSz,texSz;uniform mat2 geo;uniform float hon;uniform float cen[8];uniform vec3 hsl[8];
vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);return vec3(abs(q.z+(q.w-q.y)/(6.*d+.00001)),d/(q.x+.00001),q.x);}
vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}
float h(vec2 s){return fract(sin(dot(s,vec2(12.9898,78.233)))*43758.5453);}
void main(){
 vec2 s=geo*((v-.5)*outSz)/texSz+.5;
 vec3 c=texture2D(t,s).rgb;
 if(on>.5){
  vec3 b=(texture2D(t,s+vec2(px.x,0.)).rgb+texture2D(t,s-vec2(px.x,0.)).rgb+texture2D(t,s+vec2(0.,px.y)).rgb+texture2D(t,s-vec2(0.,px.y)).rgb)*.25;
  c+=(c-b)*sharp*2.5;
  c.r+=temp*.12;c.b-=temp*.12;c.g+=tint*.06;c.r+=tint*.03;c.b+=tint*.03;
  c*=pow(2.,exposure);
  float l=dot(c,vec3(.2126,.7152,.0722));
  c+=shadows*.35*pow(1.-clamp(l,0.,1.),2.)*(1.-l*.0);
  c+=highlights*.35*pow(clamp(l,0.,1.),2.);
  c=(c-blacks*.12)/(1.+whites*.25-blacks*.12);
  c=(c-.5)*(1.+contrast)+.5;
  c=clamp(c,0.,1.);c=vec3(texture2D(lut,vec2(c.r*.99609+.00195,.5)).r,texture2D(lut,vec2(c.g*.99609+.00195,.5)).g,texture2D(lut,vec2(c.b*.99609+.00195,.5)).b);
  float g=dot(c,vec3(.2126,.7152,.0722));
  float mx=max(c.r,max(c.g,c.b)),mn=min(c.r,min(c.g,c.b));
  float cs=mx-mn;
  c=mix(vec3(g),c,1.+sat+vib*(1.-clamp(cs*1.5,0.,1.)));
  if(hon>.5){vec3 hs=rgb2hsv(clamp(c,0.,1.));float hh=0.,ss=0.,ll=0.;for(int i=0;i<8;i++){float dd=abs(hs.x-cen[i]);dd=min(dd,1.-dd);float w=max(0.,1.-dd/.1);w=w*w*(3.-2.*w)*smoothstep(0.,.12,hs.y);hh+=w*hsl[i].x;ss+=w*hsl[i].y;ll+=w*hsl[i].z;}hs.x=fract(hs.x+hh*.08);hs.y=clamp(hs.y*(1.+ss),0.,1.);hs.z=clamp(hs.z*(1.+ll*.5),0.,1.);c=hsv2rgb(hs);}
  float d=distance(v,vec2(.5));
  float f=smoothstep(.25,.85,d);
  c=vig>0.?c*(1.-vig*f):c+(-vig)*f*(1.-c);
  c+=(h(v/px)-.5)*grain*.25;
 }
 gl_FragColor=vec4(clamp(c,0.,1.),1.);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))toast('Ошибка шейдера: '+gl.getShaderInfoLog(s));return s}
const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);gl.useProgram(prog);
const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U={};['t','px','on',...KEYS].forEach(k=>U[k]=gl.getUniformLocation(prog,k));

function render(){
 if(!hasImg)return;
 gl.viewport(0,0,cv.width,cv.height);
 gl.uniform1i(U.t,0);gl.uniform2f(U.px,1/TW,1/TH);gl.uniform2f(U.outSz,cv.width,cv.height);gl.uniform2f(U.texSz,TW,TH);gl.uniformMatrix2fv(U.geo,false,GM);
 gl.uniform1f(U.on,before?0:1);gl.uniform1i(U.lut,1);gl.uniform1f(U.hon,hsl.some(a=>a.some(x=>x))?1:0);gl.uniform1fv(U.cen,CEN);gl.uniform3fv(U.hsl,hsl.flat());
 KEYS.forEach(k=>gl.uniform1f(U[k],V[k]));
 gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
 drawHist();
}
let raf=0;function req(){paintAll();cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}

const hc=$('hist'),hx=hc.getContext('2d'),tmp=document.createElement('canvas');tmp.width=128;tmp.height=96;const tx=tmp.getContext('2d',{willReadFrequently:true});
function drawHist(){
 tx.drawImage(cv,0,0,128,96);
 let d;try{d=tx.getImageData(0,0,128,96).data}catch(e){return}
 const H=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)];
 for(let i=0;i<d.length;i+=4){H[0][d[i]]++;H[1][d[i+1]]++;H[2][d[i+2]]++}
 let m=1;for(const a of H)for(let i=2;i<254;i++)m=Math.max(m,a[i]);
 hx.clearRect(0,0,256,80);hx.globalCompositeOperation='lighter';
 ['#d33','#2b3','#35e'].forEach((col,ci)=>{hx.fillStyle=col;for(let i=0;i<256;i++){const h=Math.min(80,H[ci][i]/m*76);hx.fillRect(i,80-h,1,h)}});
 hx.globalCompositeOperation='source-over';
}

function load(img){
 {
  const max=Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE),4096);
  let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height,s=Math.min(1,max/Math.max(w,h));
  w=Math.round(w*s);h=Math.round(h*s);
  const t2=document.createElement('canvas');t2.width=w;t2.height=h;t2.getContext('2d').drawImage(img,0,0,w,h);
  TW=w;TH=h;resetGeo();HS=[snap()];hp=0;syncBtns();
  if(tex)gl.deleteTexture(tex);
  tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,t2);
  [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR));
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  hasImg=true;$('empty').style.display='none';
  ['cmp','fit','exp','reset'].forEach(i=>$(i).disabled=false);
  resetView();req();
 }
}
function toast(m){const t=$('toast');t.textContent=m;t.style.display=m?'block':'none'}
addEventListener('error',e=>toast('Ошибка: '+e.message));
async function loadFile(f){
 if(!f)return;
 if(!f.type.startsWith('image/')){toast('Это не изображение. Выберите JPEG, PNG или WebP.');return}
 toast('Загрузка…');
 try{const bm=await createImageBitmap(f);load(bm);toast('')}
 catch(e1){
  const r=new FileReader();
  r.onerror=()=>toast('Не удалось прочитать файл.');
  r.onload=()=>{const im=new Image();im.onload=()=>{try{load(im);toast('')}catch(x){toast('Ошибка: '+x.message)}};im.onerror=()=>toast('Браузер не смог открыть этот формат. Попробуйте JPEG, PNG или WebP.');im.src=r.result};
  r.readAsDataURL(f);
 }
}

// sliders
const sl=$('sl'),ins={};
GROUPS.forEach(([name,items])=>{
 const h=document.createElement('h3');h.textContent=name;sl.appendChild(h);
 items.forEach(([k,label,min,max])=>{
  const r=document.createElement('div');r.className='r';
  r.innerHTML=`<label for="s_${k}">${label}</label><input id="s_${k}" type="range" min="${min}" max="${max}" step="0.01" value="0"><output>0</output>`;
  const i=r.querySelector('input'),o=r.querySelector('output');
  i.oninput=()=>{V[k]=+i.value;o.textContent=Math.round(V[k]*100);req()};
  i.ondblclick=()=>{i.value=0;i.oninput()};
  ins[k]=[i,o];sl.appendChild(r);
 });
});
function setAll(p){KEYS.forEach(k=>{V[k]=p[k]||0;ins[k][0].value=V[k];ins[k][1].textContent=Math.round(V[k]*100)});req()}
Object.entries(PRESETS).forEach(([n,p])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>setAll(p);$('pre').appendChild(b)});
// curves + HSL
const CEN=[0,30,60,120,180,240,270,300].map(d=>d/360),hsl=Array.from({length:8},()=>[0,0,0]);
['lut','hon','cen','hsl'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
const lutTex=gl.createTexture();gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lutTex);
[gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(p=>gl.texParameteri(gl.TEXTURE_2D,p,gl.LINEAR));
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.activeTexture(gl.TEXTURE0);
const CUR=[0,1,2,3].map(()=>[[0,0],[1,1]]),CC=['','#d33','#2b3','#35e'];let ch=0,di=-1,band=0;
function mk(P){const n=P.length,x=P.map(p=>p[0]),y=P.map(p=>p[1]),d=[],m=[];
 for(let i=0;i<n-1;i++)d[i]=(y[i+1]-y[i])/((x[i+1]-x[i])||1e-6);
 m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
 for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0}else{const a=m[i]/d[i],b=m[i+1]/d[i],s=a*a+b*b;if(s>9){const t=3/Math.sqrt(s);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}}
 return v=>{if(v<=x[0])return y[0];if(v>=x[n-1])return y[n-1];let i=0;while(v>x[i+1])i++;const h=x[i+1]-x[i],t=(v-x[i])/h,t2=t*t,t3=t2*t;return Math.min(1,Math.max(0,(2*t3-3*t2+1)*y[i]+(t3-2*t2+t)*h*m[i]+(-2*t3+3*t2)*y[i+1]+(t3-t2)*h*m[i+1]))}}
function updateLut(){const f=CUR.map(mk),d=new Uint8Array(768);
 for(let i=0;i<256;i++){const m=f[0](i/255);for(let c=0;c<3;c++)d[i*3+c]=Math.round(255*f[c+1](m))}
 gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,lutTex);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,256,1,0,gl.RGB,gl.UNSIGNED_BYTE,d);gl.activeTexture(gl.TEXTURE0)}
const cc=$('cc'),cx=cc.getContext('2d');
function drawCurve(){const W=240,cs=getComputedStyle(document.documentElement);cx.clearRect(0,0,W,W);
 cx.strokeStyle=cs.getPropertyValue('--line').trim();cx.lineWidth=1;
 for(let i=1;i<4;i++){cx.beginPath();cx.moveTo(i*W/4,0);cx.lineTo(i*W/4,W);cx.moveTo(0,i*W/4);cx.lineTo(W,i*W/4);cx.stroke()}
 const col=ch?CC[ch]:cs.getPropertyValue('--text').trim();cx.strokeStyle=col;cx.fillStyle=col;cx.lineWidth=2;const f=mk(CUR[ch]);cx.beginPath();
 for(let i=0;i<=W;i++){const yy=W-f(i/W)*W;i?cx.lineTo(i,yy):cx.moveTo(i,yy)}cx.stroke();
 CUR[ch].forEach(p=>{cx.beginPath();cx.arc(p[0]*W,W-p[1]*W,5,0,7);cx.fill()})}
const upd=()=>{drawCurve();updateLut();req()};
const pos=e=>{const r=cc.getBoundingClientRect();return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,1-(e.clientY-r.top)/r.height))]};
const near=(P,u,w)=>P.findIndex(p=>Math.hypot(p[0]-u,p[1]-w)<.06);
cc.onpointerdown=e=>{const [u,w]=pos(e),P=CUR[ch];let i=near(P,u,w);
 if(i<0){const nx=Math.min(.98,Math.max(.02,u));P.push([nx,w]);P.sort((a,b)=>a[0]-b[0]);i=P.findIndex(p=>p[0]===nx);upd()}
 di=i;cc.setPointerCapture(e.pointerId)};
cc.onpointermove=e=>{if(di<0)return;const P=CUR[ch],[u,w]=pos(e),p=P[di];
 if(di>0&&di<P.length-1)p[0]=Math.min(P[di+1][0]-.02,Math.max(P[di-1][0]+.02,u));
 p[1]=w;upd()};
cc.onpointerup=()=>di=-1;
cc.ondblclick=e=>{const [u,w]=pos(e),P=CUR[ch],i=near(P,u,w);if(i>0&&i<P.length-1){P.splice(i,1);upd()}};
['RGB','R','G','B'].forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{ch=i;[...$('tabs').children].forEach((x,j)=>x.classList.toggle('on',j===i));drawCurve()};$('tabs').appendChild(b)});
$('tabs').children[0].classList.add('on');
const BN=['Красный','Оранжевый','Жёлтый','Зелёный','Голубой','Синий','Фиолетовый','Пурпурный'],BC=['#e33','#f93','#ec3','#3b4','#3cc','#35e','#93d','#e3a'],hi=[];
BN.forEach((n,i)=>{const b=document.createElement('button');b.title=n;b.setAttribute('aria-label',n);b.style.cssText='width:26px;height:26px;padding:0;border-radius:50%;background:'+BC[i];b.onclick=()=>{band=i;showBand()};$('bands').appendChild(b)});
['Оттенок','Насыщенность','Яркость'].forEach((n,j)=>{const r=document.createElement('div');r.className='r';r.innerHTML=`<label>${n}</label><input aria-label="${n}" type="range" min="-1" max="1" step="0.01" value="0"><output>0</output>`;
 const i=r.querySelector('input'),o=r.querySelector('output');i.oninput=()=>{hsl[band][j]=+i.value;o.textContent=Math.round(i.value*100);req()};i.ondblclick=()=>{i.value=0;i.oninput()};hi.push([i,o]);$('hs').appendChild(r)});
function showBand(){[...$('bands').children].forEach((b,i)=>b.style.outline=i===band?'2px solid var(--acc)':'none');hi.forEach(([i,o],j)=>{i.value=hsl[band][j];o.textContent=Math.round(hsl[band][j]*100)});paintAll()}
updateLut();drawCurve();showBand();
function paint(i){const mn=+i.min,mx=+i.max,p=(+i.value-mn)/(mx-mn)*100,z=(0-mn)/(mx-mn)*100,a=Math.min(p,z),b=Math.max(p,z);
 const g={s_temp:'linear-gradient(90deg,#3d7fd6,#f0d24a)',s_tint:'linear-gradient(90deg,#3dbf6a,#d65bc0)'}[i.id];
 i.style.backgroundImage=g||`linear-gradient(90deg,var(--tr) ${a}%,var(--text) ${a}%,var(--text) ${b}%,var(--tr) ${b}%)`}
function paintAll(){document.querySelectorAll('input[type=range]').forEach(paint)}
document.querySelectorAll('#side h3').forEach(h=>{const body=document.createElement('div');body.className='body';let n=h.nextElementSibling;
 while(n&&n.tagName!=='H3'&&!n.classList.contains('stop')){const nx=n.nextElementSibling;body.appendChild(n);n=nx}
 h.after(body);h.tabIndex=0;h.setAttribute('role','button');h.setAttribute('aria-expanded','true');
 const t=()=>{const o=body.hidden=!body.hidden;h.setAttribute('aria-expanded',String(!o));h.classList.toggle('shut',o)};
 h.onclick=t;h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});
// geometry
let TW=1,TH=1,GM=new Float32Array([1,0,0,1]);const GEO={rot:0,ang:0,flip:false,ratio:0};
['outSz','texSz','geo'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
function updateGeo(){const odd=GEO.rot%2,w=odd?TH:TW,h=odd?TW:TH,r=GEO.ratio,a=r?(h>w&&r>1?1/r:r):w/h,th=GEO.ang*Math.PI/180,co=Math.abs(Math.cos(th)),si=Math.abs(Math.sin(th));
 const cw=Math.min(w/(co+si/a),h/(si+co/a)),ch=cw/a;
 cv.width=Math.max(1,Math.round(cw));cv.height=Math.max(1,Math.round(ch));
 const f=GEO.flip?-1:1,p=(GEO.rot*90+GEO.ang)*Math.PI/180,c=Math.cos(p),s=Math.sin(p);
 GM=new Float32Array([c*f,s*f,-s,c]);req()}
function resetGeo(){Object.assign(GEO,{rot:0,ang:0,flip:false,ratio:0});syncGeoUI();updateGeo()}
const AR=[['Оригинал',0],['1:1',1],['4:3',4/3],['3:2',3/2],['16:9',16/9],['5:4',5/4]];
$('geo').innerHTML='<div class="tabs"><button id="rl">⟲ 90°</button><button id="rr">⟳ 90°</button><button id="fl">Отразить</button></div><div class="tabs" id="ar"></div><div class="r"><label for="ang">Выпрямление</label><input id="ang" type="range" min="-15" max="15" step="0.1" value="0"><output id="angv">0°</output></div>';
AR.forEach(([n,v])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{GEO.ratio=v;syncGeoUI();updateGeo()};$('ar').appendChild(b)});
$('rl').onclick=()=>{GEO.rot=(GEO.rot+3)%4;updateGeo()};$('rr').onclick=()=>{GEO.rot=(GEO.rot+1)%4;updateGeo()};$('fl').onclick=()=>{GEO.flip=!GEO.flip;updateGeo()};
$('ang').oninput=e=>{GEO.ang=+e.target.value;syncGeoUI();updateGeo()};$('ang').ondblclick=()=>{GEO.ang=0;syncGeoUI();updateGeo()};
function syncGeoUI(){$('ang').value=GEO.ang;$('angv').textContent=GEO.ang.toFixed(1).replace('.0','')+'°';[...$('ar').children].forEach((b,i)=>b.classList.toggle('on',AR[i][1]===GEO.ratio))}
syncGeoUI();
// undo / redo
const snap=()=>JSON.stringify({V,CUR,hsl,GEO});let HS=[snap()],hp=0;
function syncBtns(){$('undo').disabled=hp<1;$('redo').disabled=hp>=HS.length-1}
function commit(){const s=snap();if(s===HS[hp])return;HS.splice(hp+1);HS.push(s);if(HS.length>100)HS.shift();hp=HS.length-1;syncBtns()}
function restore(s){const o=JSON.parse(s);Object.assign(GEO,o.GEO);o.CUR.forEach((p,i)=>CUR[i]=p);o.hsl.forEach((a,i)=>hsl[i]=a);setAll(o.V);showBand();syncGeoUI();updateLut();drawCurve();updateGeo()}
function undo(){if(hp>0){hp--;restore(HS[hp]);syncBtns()}}
function redo(){if(hp<HS.length-1){hp++;restore(HS[hp]);syncBtns()}}
$('undo').onclick=undo;$('redo').onclick=redo;
['change','pointerup','click','dblclick'].forEach(n=>addEventListener(n,()=>setTimeout(commit,0),true));
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo()}});
paintAll();
$('reset').onclick=()=>{resetGeo();setAll({});CUR.forEach((_,i)=>CUR[i]=[[0,0],[1,1]]);hsl.forEach(a=>a.fill(0));showBand();upd()};

// before / after
const on=()=>{before=true;req()},off=()=>{before=false;req()};
const cb=$('cmp');cb.onpointerdown=on;cb.onpointerup=cb.onpointerleave=off;
addEventListener('keydown',e=>{if(e.key==='\\'&&hasImg)on()});addEventListener('keyup',e=>{if(e.key==='\\')off()});

// zoom / pan
let z=1,px=0,py=0;const wrap=$('wrap'),stage=$('stage');
function apply(){wrap.style.transform=`translate(${px}px,${py}px) scale(${z})`}
function resetView(){z=1;px=py=0;apply()}
$('fit').onclick=resetView;
stage.addEventListener('wheel',e=>{if(!hasImg)return;e.preventDefault();z=Math.min(16,Math.max(.2,z*(e.deltaY<0?1.12:1/1.12)));apply()},{passive:false});
let drag=null;
stage.addEventListener('pointerdown',e=>{if(hasImg&&e.target!==$('empty')){drag=[e.clientX-px,e.clientY-py];stage.setPointerCapture(e.pointerId)}});
stage.addEventListener('pointermove',e=>{if(drag){px=e.clientX-drag[0];py=e.clientY-drag[1];apply()}});
stage.addEventListener('pointerup',()=>drag=null);

// input
$('open').onclick=()=>$('file').click();
$('file').onchange=e=>loadFile(e.target.files[0]);
['dragenter','dragover'].forEach(n=>stage.addEventListener(n,e=>{e.preventDefault();stage.classList.add('drag')}));
['dragleave','drop'].forEach(n=>stage.addEventListener(n,e=>{e.preventDefault();stage.classList.remove('drag')}));
stage.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])][0];if(f)loadFile(f)});

// export
$('exp').onclick=()=>{
 before=false;render();
 const type=$('fmt').value,ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[type];
 cv.toBlob(async b=>{const name='photo-edit.'+ext;let dl=null;try{dl=await window.claude?.use('downloads')}catch(e){}if(dl){try{await dl.save({filename:name,data:b})}catch(e){if(e.code!=='declined')alert('Не удалось сохранить файл: '+(e.message||e.code))}return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()},type,.92);
};
</script>
